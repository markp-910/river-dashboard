<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clinton River & Paint Creek Conditions</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>body{font-family:system-ui,sans-serif;margin:0;background:#0f1d2b;color:#e8eef4}header{padding:16px;background:#14324a}h1{margin:0;font-size:1.3em}h2{padding:0 16px;margin:20px 0 6px;color:#7fd1ff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;padding:0 16px}.card{background:#1b2d40;border-radius:10px;padding:12px}
.card h3{margin:0 0 4px;font-size:1em}.sub{font-size:.8em;color:#9fb3c8}.vals{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0}.v b{font-size:1.4em;display:block}.v span{font-size:.75em;color:#9fb3c8}
.up{color:#ffb347}.down{color:#7fd1ff}.steady{color:#9be89b}.off{opacity:.6}canvas{max-height:150px}</style></head><body>
<header><h1>🎣 Clinton River & Paint Creek — Live Conditions</h1><div class="sub">USGS real-time data · Oakland & Macomb Co., MI · <span id="now"></span></div></header>
<div id="app"></div>
<script>
const GROUPS={"Paint Creek":[["04161540","Paint Creek at Rochester"],["04161500","Paint Creek near Lake Orion"]],
"Clinton River (main stem)":[["04161000","Clinton R at Auburn Hills"],["04161820","Clinton R at Sterling Heights"],["04164000","Clinton R near Fraser"],["04165500","Clinton R at Moravian Dr, Mt. Clemens"]],
"Clinton River branches":[["04164151","N Branch at 26 Mile nr Meade"],["04164500","N Branch near Mt. Clemens"],["04164800","Middle Branch at Macomb"]]};
const ALL=Object.values(GROUPS).flat().map(s=>s[0]);
const fmt=d=>new Date(d).toLocaleString("en-US",{timeZone:"America/New_York",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})+" ET";
document.getElementById("now").textContent="Loaded "+fmt(Date.now());
async function medians(){const t=new Date(),m=t.getMonth()+1,d=t.getDate(),out={};
 try{const r=await (await fetch(`https://waterservices.usgs.gov/nwis/stat/?format=rdb&sites=${ALL.join(",")}&statReportType=daily&statTypeCd=p50&parameterCd=00060`)).text();
 let h=null;for(const l of r.split("\n")){if(l.startsWith("#")||!l)continue;const c=l.split("\t");if(!h){h=c;continue}if(c[0]!=="USGS")continue;
 const o=Object.fromEntries(h.map((k,i)=>[k,c[i]]));if(+o.month_nu===m&&+o.day_nu===d)out[o.site_no]=+o.p50_va;}}catch(e){}return out}
function trend(v){if(v.length<5)return["—",""];const last=v[v.length-1].y,ago=v.find(p=>p.x>=v[v.length-1].x-6*3600e3)?.y;if(!ago)return["—",""];const p=(last-ago)/ago*100;
 return p>5?["▲ Rising","up"]:p<-5?["▼ Falling","down"]:["● Steady","steady"]}
(async()=>{const [iv,med]=await Promise.all([fetch(`https://waterservices.usgs.gov/nwis/iv/?format=json&sites=${ALL.join(",")}&parameterCd=00060,00065,00010&period=P7D&siteStatus=all`).then(r=>r.json()),medians()]);
 const data={};for(const ts of iv.value.timeSeries){const s=ts.sourceInfo.siteCode[0].value,p=ts.variable.variableCode[0].value;
  const vals=ts.values[0].value.filter(x=>+x.value>-9999).map(x=>({x:Date.parse(x.dateTime),y:+x.value}));(data[s]??={})[p]=vals}
 const app=document.getElementById("app");
 for(const [g,sites] of Object.entries(GROUPS)){app.insertAdjacentHTML("beforeend",`<h2>${g}</h2>`);const grid=document.createElement("div");grid.className="grid";app.appendChild(grid);
  for(const [id,name] of sites){const d=data[id]||{},q=d["00060"]||[],h=d["00065"]||[],w=d["00010"]||[],last=a=>a.length?a[a.length-1]:null;
   const c=document.createElement("div");c.className="card";const ql=last(q),hl=last(h),wl=last(w);
   if(!ql&&!hl){c.classList.add("off");c.innerHTML=`<h3>${name}</h3><div class="sub">USGS ${id}</div><p>No live data currently reported (gage offline/discontinued).${med[id]?` Historical median for today: ${med[id]} cfs.`:""}</p>`;grid.appendChild(c);continue}
   const [tt,tc]=trend(q.length?q:h);const pct=ql&&med[id]?Math.round(ql.y/med[id]*100):null;
   c.innerHTML=`<h3>${name}</h3><div class="sub">USGS <a style="color:#7fd1ff" href="https://waterdata.usgs.gov/monitoring-location/${id}/" target="_blank">${id}</a> · updated ${fmt((ql||hl).x)}</div>
   <div class="vals"><div class="v"><b>${ql?ql.y:"—"}</b><span>cfs</span></div><div class="v"><b>${hl?hl.y:"—"}</b><span>gage ft</span></div>
   ${wl?`<div class="v"><b>${(wl.y*9/5+32).toFixed(1)}°F</b><span>water (${wl.y}°C)</span></div>`:""}<div class="v"><b class="${tc}">${tt}</b><span>6-hr trend</span></div></div>
   <div class="sub">${pct!=null?`Median for today: ${med[id]} cfs → <b>${pct}%</b> of normal`:"Median for today: n/a"}</div><canvas></canvas>`;
   grid.appendChild(c);const s=q.length?q:h;new Chart(c.querySelector("canvas"),{type:"line",data:{labels:s.map(p=>new Date(p.x).toLocaleDateString("en-US",{timeZone:"America/New_York",weekday:"short"})),
   datasets:[{data:s.map(p=>p.y),borderColor:"#7fd1ff",pointRadius:0,borderWidth:1.5,fill:false}]},options:{animation:false,plugins:{legend:{display:false}},scales:{x:{ticks:{maxTicksLimit:7,color:"#9fb3c8"}},y:{title:{display:true,text:q.length?"cfs":"ft",color:"#9fb3c8"},ticks:{color:"#9fb3c8"}}}}})}}
 document.body.dataset.ready=1})();
</script></body></html>
