  else if(tempF>=40){score+=1;parts.push(`${tempF.toFixed(0)}°F is cool; fish slower and deeper`);cls="y"}
  else{score-=1;parts.push(`${tempF.toFixed(0)}°F — trout sluggish, slow presentations`);cls="y"}}

  else if(pct<=150){flow="Normal";score+=2;parts.push(`flow near normal (${pct}% of median)`)}
  else if(pct<=200){flow="High";score-=1;parts.push(`flow high (${pct}% of median) — stained, fish edges`)}

const charts=[];
function mkChart(canvas,series,p,big){const s=p==="00010"?series.map(q=>({x:q.x,y:C2F(q.y)})):series;

(async()=>{let iv,med;try{[iv,med]=await Promise.all([fetchRetry(`https://waterservices.usgs.gov/nwis/iv/?format=json&sites=${ALL.join(",")}&parameterCd=00060,00065,00010,00300,63680&period=P7D&siteStatus=all`).then(r=>r.json()),medians()])}catch(e){document.getElementById("banner").textContent="⚠️ USGS data service is not responding right now ("+e.message+"). Map, tags and log still work — reload in a few minutes.";iv={value:{timeSeries:[]}};med={}};MED=med;

(()=>{const DIR=(la,ln)=>`https://www.google.com/maps/dir/?api=1&destination=${la},${ln}`,GM=(la,ln)=>`https://www.google.com/maps/search/?api=1&query=${la},${ln}`;
const esc=x=>String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mi=(a,b,c,d)=>{const r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 7917.6*Math.asin(Math.sqrt(x))};
const GEO={enableHighAccuracy:true,maximumAge:0,timeout:15000};let AD={gages:{},access:[]},map,tagLayer;const KEY="fishTags",URLK="sheetUrl";
const tags=()=>JSON.parse(localStorage.getItem(KEY)||"[]"),saveTags=t=>{localStorage.setItem(KEY,JSON.stringify(t));renderTags()};
const icon=(e)=>L.divIcon({className:"pin",html:e,iconSize:[24,24],iconAnchor:[12,12]});
const dataReady=new Promise(r=>document.body.dataset.ready?r():addEventListener("dataready",r,{once:true}));
async function init(){
 try{AD=await (await fetch("access-data.json")).json()}catch(e){console.warn("access data",e)}
 map=L.map("map",{scrollWheelZoom:false}).setView([42.62,-83.05],10);
 L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"© OpenStreetMap contributors"}).addTo(map);
 const LY={gage:L.layerGroup(),bridge:L.layerGroup(),park:L.layerGroup(),fishing:L.layerGroup(),spot:L.layerGroup(),fish:L.layerGroup()},gL=LY.gage;window._LY=LY;tagLayer={clearLayers(){LY.spot.clearLayers();LY.fish.clearLayers()}};
 const hid=new Set(JSON.parse(localStorage.getItem("hiddenLayers")||"[]"));
 document.querySelectorAll(".maplegend button").forEach(b=>{const k=b.dataset.l,ap=()=>{const off=hid.has(k);b.classList.toggle("off",off);b.setAttribute("aria-pressed",String(!off));off?map.removeLayer(LY[k]):LY[k].addTo(map)};ap();
  b.onclick=()=>{hid.has(k)?hid.delete(k):hid.add(k);localStorage.setItem("hiddenLayers",JSON.stringify([...hid]));ap()}});
 for(const p of AD.access){const col=p.type==="bridge"?"#8b5a2b":p.type==="fishing"?"#e0a800":"#2f8a57";
  L.circleMarker([p.lat,p.lng],{radius:p.type==="fishing"?7:5,color:col,fillColor:col,fillOpacity:.8,weight:1}).bindPopup(`<b>${esc(p.name)}</b><br>${p.type} · ${p.mi} mi from ${esc(NAME[p.near]||p.near)}<br><a href="${DIR(p.lat,p.lng)}" target="_blank">Directions</a>`).addTo(LY[p.type]||LY.park)}
 addLocate();await dataReady;
 for(const [id,g] of Object.entries(AD.gages)){const i=INFO[id];
  L.circleMarker([g.lat,g.lng],{radius:9,color:"#fff",weight:2,fillColor:i?"#1e88e5":"#777",fillOpacity:1}).bindPopup(`<b>${esc(NAME[id])}</b><br>USGS ${id}<br>${i?`${i.flow??"—"} cfs${i.tempF!=null?" · "+i.tempF.toFixed(0)+"°F":""}<br>🐟 ${esc(i.t.label)}`:"offline"}<br>${esc(g.address)}<br><a href="${DIR(g.lat,g.lng)}" target="_blank">Directions</a> · <a href="#site-${id}">Card</a>`).addTo(gL);
  const card=document.getElementById("site-"+id);if(card){const a=document.createElement("div");a.className="addr";a.innerHTML=`📍 Near ${esc(g.address)} <a href="${DIR(g.lat,g.lng)}" target="_blank">Directions ↗</a>`;
   a.querySelector("a").onclick=e=>e.stopPropagation();card.querySelector(".sub").after(a)}}
 renderTags();document.getElementById("sheetUrl").value=localStorage.getItem(URLK)||"";document.body.dataset.mapready=1}
function toast(m){let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";document.body.appendChild(t)}t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),4500)}
function addLocate(){let state=0,watch=null,dot=null,circ=null,btn;
 const set=(s)=>{state=s;btn.classList.toggle("on",s>0);btn.classList.toggle("follow",s===2);btn.title=["Show my precise location","Tap for live follow","Following — tap to stop"][s]};
 const err=e=>{toast(e.code===1?"Location permission denied — enable it in your browser/site settings.":e.code===2?"Location unavailable — try moving to open sky.":e.code===3?"Location timed out — try again.":"Location error: "+e.message);stop()};
 const stop=()=>{if(watch!=null)navigator.geolocation.clearWatch(watch);watch=null;set(0)};
 const show=(p,zoom)=>{const la=p.coords.latitude,ln=p.coords.longitude,acc=p.coords.accuracy,ll=[la,ln],n=nearestGage(la,ln);
  if(!dot){circ=L.circle(ll,{radius:acc,color:"#1e88e5",weight:1,fillOpacity:.12}).addTo(map);dot=L.circleMarker(ll,{radius:8,color:"#fff",weight:3,fillColor:"#1e88e5",fillOpacity:1}).addTo(map)}
  else{dot.setLatLng(ll);circ.setLatLng(ll).setRadius(acc)}
  dot.bindPopup(`<b>You are here</b><br>${la.toFixed(6)}, ${ln.toFixed(6)}<br>±${Math.round(acc*3.28084)} ft<br>${n?`Nearest gage: ${esc(NAME[n.id])} (${n.d.toFixed(2)} mi)`:""}`,{maxWidth:210,autoPanPaddingTopLeft:L.point(70,20)});
  if(zoom){map.setView(ll,16,{animate:false});const w=map.getSize().x;if(w<700)map.panBy([-Math.min(70,w/2-125),0],{animate:false});dot.openPopup()}else map.panTo(ll)};
 const C=L.Control.extend({options:{position:"topleft"},onAdd(){btn=L.DomUtil.create("a","locbtn leaflet-bar");btn.href="#";btn.setAttribute("role","button");btn.innerHTML="⌖";set(0);
  L.DomEvent.on(btn,"click",e=>{L.DomEvent.stop(e);if(!navigator.geolocation)return toast("Geolocation not supported on this device.");
   if(state===0){toast("Getting precise location…");navigator.geolocation.getCurrentPosition(p=>{show(p,true);set(1)},err,GEO)}
   else if(state===1){watch=navigator.geolocation.watchPosition(p=>show(p,false),err,GEO);set(2);toast("Live follow on")}
   else{stop();toast("Live follow off")}});return btn}});new C().addTo(map)}
function nearestGage(la,ln){let best=null;for(const [id,g] of Object.entries(AD.gages)){if(!INFO[id])continue;const d=mi(la,ln,g.lat,g.lng);if(!best||d<best.d)best={id,d}}return best}
let pending=null;
function startTag(type){const go=pos=>{const la=+pos.coords.latitude.toFixed(6),ln=+pos.coords.longitude.toFixed(6),n=nearestGage(la,ln),i=n&&INFO[n.id];
  pending={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),type,timestamp:new Date().toISOString(),lat:la,lng:ln,nearest_gage:n?.id||"",gage_name:n?NAME[n.id]:"",gage_dist_mi:n?+n.d.toFixed(2):"",
   flow_cfs:i?.flow??"",pct_median:i?.pct??"",temp_f:i?.tempF!=null?+i.tempF.toFixed(1):"",rating:i?.t.label||"",species:"",length_in:"",fly_lure:"",note:"",synced:false};
  const f=document.getElementById("tagform");f.reset();pendingPhoto=null;document.getElementById("photoPrev").hidden=true;document.getElementById("fishFields").style.display=type==="fish"?"":"none";
  document.getElementById("tagTitle").textContent=type==="fish"?"🐟 Log a fish":"📍 Tag this spot";
  document.getElementById("tagCtx").textContent=`${la}, ${ln} · nearest gage ${pending.gage_name} (${pending.gage_dist_mi} mi): ${pending.flow_cfs} cfs${pending.temp_f!==""?", "+pending.temp_f+"°F":""}, ${pending.rating}`;
  document.getElementById("tagdlg").style.display="flex"};
 if(!navigator.geolocation)return alert("Geolocation not available");
 navigator.geolocation.getCurrentPosition(go,e=>alert("Couldn't get location: "+e.message),GEO)}
document.addEventListener("click",e=>{const b=e.target.closest("[data-del]");if(!b)return;e.preventDefault();e.stopPropagation();delTag(b.dataset.del)});
async function delTag(id){const t=tags(),x=t.find(v=>String(v.id)===String(id));if(!x)return;
 if(!confirm(`Delete this ${x.type==="fish"?"catch":"spot"} from ${new Date(x.timestamp).toLocaleString("en-US",{timeZone:"America/New_York"})} ET?${x.synced?" It will also be removed from the Google Sheet.":""}`))return;
 saveTags(t.filter(v=>v!==x));map.closePopup();photoDel(x.id).catch(()=>{});const u=localStorage.getItem(URLK);
 if(!x.synced)return msg("Deleted (was not yet synced)");if(!u)return msg("Deleted locally — no Sheet URL set, Sheet copy unchanged");
 try{const r=await (await fetch(u,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"delete",id:String(x.id)})})).json();
  if(r.action==="delete")msg(r.deleted?"Deleted locally and from Sheet"+(r.photosTrashed?" (photo trashed)":""):"Deleted locally (not found in Sheet)");
  else{msg("Deleted locally — Sheet copy remains: update the Apps Script (new Code.gs) to enable Sheet deletes");toast("Sheet script is outdated — row not removed from Sheet")}}
 catch(err){msg("Deleted locally — Sheet delete failed: "+err.message)}}
const IDB=new Promise((ok,no)=>{const r=indexedDB.open("fishlog",1);r.onupgradeneeded=()=>r.result.createObjectStore("photos");r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const idb=async(mode,fn)=>{const db=await IDB;return new Promise((ok,no)=>{const tx=db.transaction("photos",mode),q=fn(tx.objectStore("photos"));tx.oncomplete=()=>ok(q&&q.result);tx.onerror=()=>no(tx.error)})};
const photoGet=id=>idb("readonly",s=>s.get(id)),photoPut=(id,v)=>idb("readwrite",s=>s.put(v,id)),photoDel=id=>idb("readwrite",s=>s.delete(id));
let pendingPhoto=null;
function resizeImage(file,max=1600,q=.8){return new Promise((ok,no)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));
 const c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",q))};img.onerror=()=>no(new Error("Couldn't read image"));img.src=u})}
document.getElementById("photoIn").onchange=async e=>{const f=e.target.files[0],pv=document.getElementById("photoPrev");pendingPhoto=null;pv.hidden=true;if(!f)return;
 try{pendingPhoto=await resizeImage(f);pv.src=pendingPhoto;pv.hidden=false}catch(err){toast(err.message)}};
document.getElementById("btnTag").onclick=()=>startTag("spot");document.getElementById("btnFish").onclick=()=>startTag("fish");
document.getElementById("tagCancel").onclick=()=>{document.getElementById("tagdlg").style.display="none";pending=null};
document.getElementById("tagform").onsubmit=async e=>{e.preventDefault();if(!pending)return;const fd=new FormData(e.target);for(const [k,v] of fd)if(typeof v==="string")pending[k]=v;const ph=pendingPhoto;pendingPhoto=null;
 if(ph&&pending.type==="fish"){pending.has_photo=true;await photoPut(pending.id,ph)}
 const t=tags();t.push(pending);saveTags(t);document.getElementById("tagdlg").style.display="none";map.setView([pending.lat,pending.lng],14);pending=null;if(localStorage.getItem(URLK))sync()};
function renderTags(){const t=tags();document.getElementById("tagCount").textContent=t.length+(t.some(x=>!x.synced)?` · ${t.filter(x=>!x.synced).length} unsynced`:"");if(!tagLayer)return;tagLayer.clearLayers();
 for(const x of t){const mk=L.marker([x.lat,x.lng],{icon:icon(x.type==="fish"?"🐟":"📍")}).bindPopup(`<b>${x.type==="fish"?esc(x.species||"Fish"):"Tagged spot"}</b>${x.length_in?" · "+esc(x.length_in)+" in":""}<br>${new Date(x.timestamp).toLocaleString("en-US",{timeZone:"America/New_York"})} ET<br>${x.fly_lure?"Fly/lure: "+esc(x.fly_lure)+"<br>":""}${x.note?esc(x.note)+"<br>":""}${esc(x.gage_name)}: ${esc(x.flow_cfs)} cfs ${x.temp_f!==""?esc(x.temp_f)+"°F":""} ${esc(x.rating)}<br><a href="${GM(x.lat,x.lng)}" target="_blank">Open in Google Maps</a> · <a href="${DIR(x.lat,x.lng)}" target="_blank">Directions</a>${x.has_photo||x.photo_thumb?`<br><img class="thumb" data-pid="${esc(x.id)}" src="${esc(x.photo_thumb||"")}" alt="catch photo">`:""}<br><button class="trash" data-del="${esc(x.id)}">🗑 Delete</button>`).addTo(x.type==="fish"?_LY.fish:_LY.spot);
  mk.on("popupopen",async ev=>{const im=ev.popup.getElement().querySelector("img[data-pid]");if(!im)return;const d=await photoGet(x.id).catch(()=>null);if(d)im.src=d})}
 document.getElementById("tagList").innerHTML=t.slice().reverse().map(x=>`<div class="t">${x.type==="fish"?"🐟":"📍"} ${new Date(x.timestamp).toLocaleString("en-US",{timeZone:"America/New_York",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})} ET · ${esc(x.species||"")} ${x.length_in?esc(x.length_in)+'"':""} · ${esc(x.gage_name)} ${x.has_photo||x.photo_url?"📷":""} ${x.synced?"✅":"⏳"} · <a href="${GM(x.lat,x.lng)}" target="_blank">Map</a> <button class="trash" data-del="${esc(x.id)}" aria-label="Delete">🗑</button></div>`).join("")}
const COLS=["id","type","timestamp","lat","lng","nearest_gage","gage_name","gage_dist_mi","flow_cfs","pct_median","temp_f","rating","species","length_in","fly_lure","note","photo_url"];
function dl(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.getElementById("expCsv").onclick=()=>{const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;dl("fishing-log.csv",[COLS.join(","),...tags().map(x=>COLS.map(c=>q(x[c])).join(","))].join("\n"),"text/csv")};
document.getElementById("expKml").onclick=()=>{const x=s=>esc(s);dl("fishing-log.kml",`<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Fishing Log</name>${tags().map(t=>`<Placemark><name>${x(t.type==="fish"?(t.species||"Fish")+(t.length_in?" "+t.length_in+" in":""):"Spot")}</name><description>${x(`${t.timestamp} | ${t.gage_name}: ${t.flow_cfs} cfs ${t.temp_f}F ${t.rating} | ${t.fly_lure} ${t.note}`)}</description><ExtendedData>${COLS.map(c=>`<Data name="${c}"><value>${x(t[c])}</value></Data>`).join("")}</ExtendedData><Point><coordinates>${t.lng},${t.lat}</coordinates></Point></Placemark>`).join("")}</Document></kml>`,"application/vnd.google-earth.kml+xml")};
const msg=m=>document.getElementById("syncMsg").textContent=m;
document.getElementById("saveUrl").onclick=()=>{const u=document.getElementById("sheetUrl").value.trim();if(u&&!/^https:\/\/script\.google(usercontent)?\.com\//.test(u))return msg("That doesn't look like an Apps Script URL");localStorage.setItem(URLK,u);msg(u?"Saved":"Cleared")};
const clean=({synced,has_photo,photo_thumb,...x})=>x;
async function post(u,body){const r=await (await fetch(u,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)})).json();if(!r.ok)throw new Error(r.error||"script error");return r}
async function sync(){const u=localStorage.getItem(URLK);if(!u)return msg("Paste your web app URL first");const q=tags().filter(x=>!x.synced);if(!q.length)return msg("Nothing to sync");
 msg("Syncing…");const done={};let n=0,warn="";
 try{const plain=q.filter(x=>!x.has_photo);if(plain.length){await post(u,plain.map(clean));plain.forEach(x=>done[x.id]={})}
  for(const x of q.filter(x=>x.has_photo)){const ph=await photoGet(x.id).catch(()=>null);
   const r=await post(u,{action:"add",tags:[clean(x)],photo:ph?{id:x.id,mime:"image/jpeg",base64:ph.split(",")[1]}:null});
   if(!r.photos){await post(u,[clean(x)]);warn=" — Sheet script is outdated, photos not uploaded (update Code.gs)";done[x.id]={}}
   else{const p=r.photos[x.id];done[x.id]=p?{photo_url:p.url,photo_thumb:p.thumb,photo_file_id:p.fileId}:{}}}
 }catch(e){warn=" — sync failed: "+e.message+" (rest kept in queue)"}
 n=Object.keys(done).length;saveTags(tags().map(x=>done[x.id]?{...x,...done[x.id],synced:true}:x));msg(`Synced ${n}/${q.length}`+warn)}
document.getElementById("syncBtn").onclick=sync;
document.getElementById("loadBtn").onclick=async()=>{const u=localStorage.getItem(URLK);if(!u)return msg("Paste your web app URL first");msg("Loading…");
 try{const r=await (await fetch(u)).json();const t=tags(),have=new Set(t.map(x=>x.id));let n=0;for(const row of r.rows||[]){if(!row.id||have.has(String(row.id)))continue;t.push({...row,id:String(row.id),lat:+row.lat,lng:+row.lng,synced:true,photo_thumb:row.photo_file_id?`https://drive.google.com/thumbnail?id=${row.photo_file_id}&sz=w400`:""});n++}saveTags(t);msg(`Loaded ${n} new from Sheet`)}catch(e){msg("Load failed: "+e.message)}};
addEventListener("online",()=>localStorage.getItem(URLK)&&tags().some(x=>!x.synced)&&sync());
init()})();
</script></body></html>
