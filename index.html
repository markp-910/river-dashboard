<script>
const GROUPS={"Tier 1 · Paint Creek":[["04161540","Paint Creek at Rochester"],["04161500","Paint Creek near Lake Orion"]],
"Tier 2 · Clinton River & branches":[["04161000","Clinton R at Auburn Hills"],["04161820","Clinton R at Sterling Heights"],["04164000","Clinton R near Fraser"],["04165500","Clinton R at Moravian Dr, Mt. Clemens"],["04164151","N Branch at 26 Mile nr Meade"],["04164500","N Branch near Mt. Clemens"],["04164800","Middle Branch at Macomb"]],
"Tier 3 · Other nearby streams":[["04162010","Red Run at Ryan Rd near Warren"],["04163400","Plum Brook at Utica"],["04164100","East Pond Creek at Romeo"],["04164300","East Branch Coon Creek at Armada"],["04166100","River Rouge at Southfield"]]};
const ALL=Object.values(GROUPS).flat().map(s=>s[0]),NAME=Object.fromEntries(Object.values(GROUPS).flat());
// nearest site that reports water temp
const TEMP_PROXY={"04161000":"04161820","04164000":"04161820","04164151":"04165500","04164500":"04165500","04164800":"04165500","04161540":"04161820","04161500":"04161820","04163400":"04162010","04164100":"04165500","04164300":"04165500"};
const PARAMS={"00060":["cfs","Discharge (cfs)"],"00065":["gage ft","Gage height (ft)"],"00010":["water °F","Water temp (°F)"],"00300":["DO mg/L","Dissolved oxygen (mg/L)"],"63680":["turb FNU","Turbidity (FNU)"]};
const fmt=d=>new Date(d).toLocaleString("en-US",{timeZone:"America/New_York",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})+" ET";
document.getElementById("now").textContent="Loaded "+fmt(Date.now());
const PORDER=["00060","00065","00010","00300","63680"];const C2F=c=>c*9/5+32;
const bandPlugin={id:"bands",beforeDraw(ch,a,o){if(!o.on)return;const {ctx,chartArea:ca,scales:{y}}=ch;
 [[-99,40,"#4a6fa5"],[40,50,"#6b7f99"],[50,65,"#2f8a57"],[65,68,"#b8860b"],[68,200,"#b22222"]].forEach(([lo,hi,c])=>{
  const t=Math.max(ca.top,y.getPixelForValue(hi)),b=Math.min(ca.bottom,y.getPixelForValue(lo));if(b>t){ctx.save();ctx.globalAlpha=.25;ctx.fillStyle=c;ctx.fillRect(ca.left,t,ca.right-ca.left,b-t);ctx.restore()}})}};
Chart.register(bandPlugin);
async function fetchRetry(u,n=3){for(let i=0;;i++){try{const r=await fetch(u);if(r.ok)return r;throw new Error("HTTP "+r.status)}catch(e){if(i>=n-1)throw e;await new Promise(z=>setTimeout(z,1500*(i+1)))}}}
async function medians(){const t=new Date(),m=t.getMonth()+1,d=t.getDate(),out={};
 try{const ch=[];for(let i=0;i<ALL.length;i+=8)ch.push(ALL.slice(i,i+8));
 const r=(await Promise.all(ch.map(c=>fetchRetry(`https://waterservices.usgs.gov/nwis/stat/?format=rdb&sites=${c.join(",")}&statReportType=daily&statTypeCd=p50&parameterCd=00060`).then(x=>x.text())))).join("\n");
 let h=null;for(const l of r.split("\n")){if(l.startsWith("#")||!l)continue;const c=l.split("\t");if(c[0]==="agency_cd"){h=c;continue}if(!h)continue;if(c[0]!=="USGS")continue;
 const o=Object.fromEntries(h.map((k,i)=>[k,c[i]]));if(+o.month_nu===m&&+o.day_nu===d)out[o.site_no]=+o.p50_va;}}catch(e){console.warn(e)}return out}
function trend(v){if(v.length<5)return["—","",0];const L=v[v.length-1],ago=v.find(p=>p.x>=L.x-6*3600e3)?.y;if(!ago)return["—","",0];const p=(L.y-ago)/ago*100;
 return p>5?["▲ Rising","up",1]:p<-5?["▼ Falling","down",-1]:["● Steady","steady",0]}
function trout(tempF,pct,tr){let score=0,parts=[],cls="g";
 if(tempF!=null){if(tempF>68){score-=5;parts.push(`water ${tempF.toFixed(0)}°F is too warm — stop fishing to protect trout`);cls="r"}
  else if(tempF>=65){score-=2;parts.push(`${tempF.toFixed(0)}°F is stressful; fish early and land fish fast`);cls="o"}
  else if(tempF>=50){score+=3;parts.push(`${tempF.toFixed(0)}°F is in the optimal range`)}
  else if(tempF>=40){score+=1;parts.push(`${tempF.toFixed(0)}°F is cool; fish slower and deeper`);cls="y"}
  else{score-=1;parts.push(`${tempF.toFixed(0)}°F — trout sluggish, slow presentations`);cls="y"}}
 let flow="";if(pct!=null){if(pct<50){flow="Very low";score-=1;parts.push(`flow very low (${pct}% of median) — spooky fish, go light/stealthy`)}
  else if(pct<80){flow="Low";score+=1;parts.push(`flow lowish (${pct}% of median), clear water likely`)}
  else if(pct<=150){flow="Normal";score+=2;parts.push(`flow near normal (${pct}% of median)`)}
  else if(pct<=200){flow="High";score-=1;parts.push(`flow high (${pct}% of median) — stained, fish edges`)}
  else{flow="Blown out";score-=4;parts.push(`flow ${pct}% of median — likely blown out`)}}
 if(tr===1&&pct!=null&&pct>100){score-=1;parts.push("and rising")}else if(tr===-1&&pct>150)parts.push("falling — could clear soon");
 if(cls==="g"&&(flow==="Blown out"))cls="r";else if(cls==="g"&&(flow==="Very low"||flow==="High"))cls="y";
 if(tempF==null&&cls==="g")cls=score>=2?"g":"y";
 const label=cls==="r"?"Poor / don't fish":cls==="o"?"Stressed":cls==="y"?"Fair":"Good";
 return {score,cls,label:`${label}${flow?" · "+flow:""}`,note:parts.join("; ")}}
const charts=[];
function mkChart(canvas,series,p,big){const s=p==="00010"?series.map(q=>({x:q.x,y:C2F(q.y)})):series;
 return new Chart(canvas,{type:"line",data:{labels:s.map(q=>new Date(q.x).toLocaleString("en-US",{timeZone:"America/New_York",weekday:"short",hour:"numeric"})),

 $("fMax").value=F.max;$("fSpx").value=F.sp;$("fCls").value=F.cls;$("fOpen").value=F.open;document.querySelectorAll("[data-tier]").forEach(c=>c.checked=F.tiers.includes(c.dataset.tier));
 const chg=()=>{F={max:+$("fMax").value,sp:$("fSpx").value,cls:$("fCls").value,open:$("fOpen").value,tiers:[...document.querySelectorAll("[data-tier]")].filter(c=>c.checked).map(c=>c.dataset.tier)};localStorage.setItem(FK,JSON.stringify(F));draw()};

 xmap=L.map("xmap",{scrollWheelZoom:false}).setView([42.75,-83.3],8);window._xmap=xmap;L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"© OpenStreetMap contributors"}).addTo(xmap);
 L.marker([XD.home.lat,XD.home.lng],{icon:L.divIcon({className:"",html:'<div class="xdot" style="background:#1e88e5;font-size:14px">🏠</div>',iconSize:[22,22],iconAnchor:[11,11]})}).bindPopup("<b>Home</b><br>"+esc(XD.home.address)).addTo(xmap);

 const byY={};s.stocking_events.forEach(e=>{(byY[e.date.slice(0,4)]??=[]).push(e)});

 $("xbox").innerHTML=`<button id="xclose" style="float:right;font-size:1.5em;background:none;border:0;color:#fff;cursor:pointer;min-width:44px;min-height:44px" aria-label="Close">✕</button>
 <h3 style="margin:0 0 6px"><span class="tierb t${s.tier}">${s.tier}</span> ${esc(s.name)}</h3>

 ${runs.length?`<div class="kv">📌 <b>Happening now:</b> ${runs.map(r=>esc(r.label)).join(", ")}</div>`:""}

 <details open><summary>🎣 Species & fishery</summary><div class="kv">${s.species.map(esc).join(" · ")}</div><div class="kv">${esc(s.reproduction)}</div><div class="kv"><b>Best seasons:</b> ${esc(s.seasons_text)}${s.best_months.length?` <span class="sub">(best months: ${s.best_months.map(x=>MONS[x-1]).join(", ")})</span>`:""}</div></details>
 <details open><summary>📡 Nearest USGS gage (live)</summary>${gl}<div class="sub">${esc(s.gage_note)}</div></details>
 <details open><summary>📜 Regulations & season</summary><div class="kv"><b>Season:</b> ${esc(s.season.label)}${s.season.inferred?' <span class="cls cU">inferred</span>':""}</div><div class="kv">${esc(s.regs)}</div><div class="kv"><b>DNR status:</b> ${esc(s.dnr)}</div><div class="kv sub">TroutRoutes: ${esc(s.tr.cls==="unknown"?"class unknown":"Class "+s.tr.cls)}${s.tr.type?" · "+esc(s.tr.type):""}${s.tr.gr?" · gear-restricted":""}. ${esc(s.tr.note||"")}</div><div class="sub">Always check the current Michigan Fishing Guide before fishing.</div></details>
 <details><summary>🐟 Stocking history (last 5 yrs, DNR)</summary><div class="kv sub">${esc(s.stocking_summary)}</div><ul>${stk}</ul></details>

 <details><summary>🅿️ Access & public land</summary><div class="kv">${esc(s.access)}</div></details>
 ${s.flags.length?`<details><summary>⚠️ Unverified / flags (${s.flags.length})</summary>${s.flags.map(f=>`<div class="flag">${esc(f)}</div>`).join("")}</details>`:""}
 <details><summary>🔗 Sources</summary><ul>${s.sources.map(u=>`<li><a href="${esc(u.split(" ")[0])}" target="_blank">${esc(u.length>70?u.slice(0,70)+"…":u)}</a></li>`).join("")}</ul></details>`;
 $("xmodal").style.display="flex";document.body.classList.add("xlock");$("xclose").onclick=closeX;$("xbox").querySelector("[data-want]").onclick=()=>toggleWant(s);refreshWantBtns();if(xmap)xmap.closePopup()}
